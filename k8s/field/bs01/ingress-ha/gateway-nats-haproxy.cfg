global
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 3s
    timeout client 1h
    timeout server 1h

listen bs01_nats
    bind 127.0.0.1:30422
    option tcp-check
    tcp-check expect string INFO
    server wknd01 192.168.0.4:30422 check inter 2s fall 2 rise 2
    server wknd02 192.168.0.5:30422 check inter 2s fall 2 rise 2
    server wknd03 192.168.0.6:30422 check inter 2s fall 2 rise 2
