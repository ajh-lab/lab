apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../manifests/argocd-image-updater

patches:
  - target:
      kind: Deployment
      name: argocd-image-updater
      namespace: argocd
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
