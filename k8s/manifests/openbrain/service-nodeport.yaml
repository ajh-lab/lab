# Node-fronted service for harness clients that cannot trust the lab
# self-signed CA (the DSH MCP client has no insecure-TLS option).
# The ClusterIP service and its ingress are left untouched for existing
# consumers. See automation/openbrain/README.md.
apiVersion: v1
kind: Service
metadata:
  name: openbrain-mcp-lan
  namespace: openbrain
spec:
  type: NodePort
  selector:
    app: openbrain-mcp
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 32100
