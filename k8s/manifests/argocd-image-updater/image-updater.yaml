apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater
data:
  applications_api: kubernetes
  git.user: DroneOps Image Updater
  git.email: argocd-image-updater@lab.local
  kube.events: "true"
  log.level: info
  registries.conf: |
    registries:
      - name: lab-registry01
        prefix: 192.168.1.15:5000
        api_url: http://192.168.1.15:5000
        insecure: true
        credentials: pullsecret:argocd/argocd-image-updater-registry-pull
        limit: 50
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-ssh-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-ssh-config
    app.kubernetes.io/part-of: argocd-image-updater
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-image-updater-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater-secret
    app.kubernetes.io/part-of: argocd-image-updater
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
  namespace: argocd
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/part-of: argocd-image-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-image-updater
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-image-updater
    spec:
      serviceAccountName: argocd-image-updater
      nodeSelector:
        kubernetes.io/hostname: oma01rpicls01mstr01
      containers:
        - name: argocd-image-updater
          image: quay.io/argoprojlabs/argocd-image-updater:v0.15.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --interval
            - 2m
          env:
            - name: APPLICATIONS_API
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: applications_api
                  optional: true
            - name: IMAGE_UPDATER_LOGLEVEL
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: log.level
                  optional: true
            - name: GIT_COMMIT_USER
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: git.user
                  optional: true
            - name: GIT_COMMIT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: git.email
                  optional: true
            - name: IMAGE_UPDATER_KUBE_EVENTS
              valueFrom:
                configMapKeyRef:
                  name: argocd-image-updater-config
                  key: kube.events
                  optional: true
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: image-updater-conf
              mountPath: /app/config
            - name: ssh-known-hosts
              mountPath: /app/config/ssh
            - name: ssh-config
              mountPath: /app/.ssh
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: image-updater-conf
          configMap:
            name: argocd-image-updater-config
            optional: true
            items:
              - key: registries.conf
                path: registries.conf
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
            optional: true
        - name: ssh-config
          configMap:
            name: argocd-image-updater-ssh-config
            optional: true
        - name: tmp
          emptyDir: {}
