alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

serverFiles:
  prometheus.yml:
    rule_files: null
    remote_write:
      - url: http://192.168.1.50:9090/api/v1/write

extraScrapeConfigs: |
  - job_name: litellm-ai-workstation
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.1.123:4001
  - job_name: deepseek-balance-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - deepseek-balance-exporter.observability.svc.cluster.local:8000
  - job_name: ai-workstation-node
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.1.123:9100
        labels:
          host: ai-workstation-evox2
  - job_name: ai-workstation-gpu
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.1.123:9101
        labels:
          host: ai-workstation-evox2

server:
  # The Pi keeps in-cluster service discovery but forwards samples to the VM.
  # Explicit flags exclude server-only TSDB options in agent mode.
  defaultFlagsOverride:
    - --config.file=/etc/config/prometheus.yml
    - --storage.agent.path=/data/agent
    - --web.enable-lifecycle
    - --agent
  remoteWrite: []
  service:
    type: NodePort
    nodePort: 32091
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 8Gi
  retention: 90d
  retentionSize: 48GB
  startupProbe:
    enabled: true
    failureThreshold: 40
    periodSeconds: 15
    timeoutSeconds: 10
  readinessProbeFailureThreshold: 12
  readinessProbePeriodSeconds: 10
  readinessProbeTimeout: 10
  livenessProbeFailureThreshold: 20
  livenessProbePeriodSeconds: 30
  livenessProbeTimeout: 30
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 800m
      memory: 1Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
